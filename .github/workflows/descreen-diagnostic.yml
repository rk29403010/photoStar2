name: descreen-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      QA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LINT_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0
      - name: Install dependencies without implicit lifecycle scripts
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild @tensorflow/tfjs-node better-sqlite3 core-js keytar onnxruntime-node sharp
          node tooling/scripts/core/fix_tfjs_binding.cjs
      - name: Workflow registry
        run: pnpm run module:check-registry
      - name: Photo tool registry
        run: pnpm run photo-tool:check-registry
      - name: Extension architecture
        run: node tooling/scripts/repo/extension-architecture-policy.mjs
      - name: Oxlint changed
        run: pnpm run lint:fast:changed
      - name: Complexity changed
        run: pnpm run complexity:changed
      - name: Core typecheck
        run: pnpm run typecheck:native:core
      - name: App typecheck
        run: pnpm run typecheck:native:app
