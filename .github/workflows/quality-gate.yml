name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-changed-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality:changed:full

      - name: Run Markdown Lint
        run: npm run lint:md

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run repo wiring tests
        run: npm run test:repo

      - name: Run UI model tests
        run: npm run test:ui
