name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install native test runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-

      - name: Run canonical merge gate
        id: qa_merge
        shell: bash
        run: |
          set -o pipefail
          pnpm run qa:merge 2>&1 | tee qa-merge.log

      - name: Add qa:merge failure summary
        if: ${{ failure() && steps.qa_merge.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '## qa:merge failure'
            echo
            echo '```text'
            tail -n 200 qa-merge.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qa:merge failure log
        if: ${{ failure() && steps.qa_merge.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-merge-log
          path: qa-merge.log
          if-no-files-found: error
          retention-days: 14
