name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install native test runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0

      - name: Install dependencies without implicit lifecycle scripts
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild @tensorflow/tfjs-node better-sqlite3 core-js keytar onnxruntime-node sharp
          node tooling/scripts/core/fix_tfjs_binding.cjs

      - name: Restore ESLint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js') }}-

      - name: Run canonical merge gate
        id: qa_merge
        shell: bash
        run: |
          set -o pipefail
          pnpm run qa:merge 2>&1 | tee qa-merge.log

      - name: Add qa:merge failure summary
        if: ${{ failure() && steps.qa_merge.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '## qa:merge failure'
            echo
            echo '```text'
            tail -n 200 qa-merge.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qa:merge failure log
        if: ${{ failure() && steps.qa_merge.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-merge-log
          path: qa-merge.log
          if-no-files-found: error
          retention-days: 14
