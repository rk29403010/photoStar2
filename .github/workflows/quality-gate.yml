name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-changed-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce lint gates on changed files
        run: npm run lint:changed
