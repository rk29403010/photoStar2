name: wp11d-vector-benchmark

on:
  pull_request:
    paths:
      - tooling/scripts/repo/wp11d-vector-benchmark.cjs
      - .github/workflows/wp11d-vector-benchmark.yml
      - src/services/machineAnalysis/featureVectorRetrieval.ts

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.3.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install native test runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm run build:core:ts
      - name: Benchmark target-tier vector retrieval
        run: node tooling/scripts/repo/wp11d-vector-benchmark.cjs
